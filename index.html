<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SaBre">
<title>SaBre</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌊%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#f3f5f7;--ink:#000;--mute:#5c6670;--line:#d9dee3;--acc:#5ab4f5;--accink:#000;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#000;--card:#111417;--ink:#fff;--mute:#9aa4ad;--line:#252b30;--acc:#7cc7ff;--accink:#000;--err:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font:800 34px/1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button.go{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;margin:12px 0 22px;align-items:center}
details{margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.f{margin:12px 0}.f label{display:block;font-weight:600;margin-bottom:4px}
.f small{color:var(--mute)}
.f input+input{margin-top:6px}
#out{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.a{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.a h2{margin:0;font-size:17px}
.st{color:var(--mute);font-size:14px}
.st.e{color:var(--err)}
.t{overflow-wrap:anywhere}
.t>*:first-child{margin-top:0}.t>*:last-child{margin-bottom:0}
.t p,.t ul,.t ol,.t pre,.t .tw{margin:0 0 .7em}
.t h3{font-size:16px;margin:1em 0 .4em}
.t ul,.t ol{padding-left:1.3em}
.t code{background:var(--bg);border-radius:4px;padding:1px 4px;font-size:.92em}
.t pre{background:var(--bg);border-radius:8px;padding:10px;overflow-x:auto}.t pre code{padding:0;background:none}
.t .tw{overflow-x:auto}.t table{border-collapse:collapse;font-size:14px}
.t th,.t td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.t hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.hint{color:var(--mute)}
.stack{flex-direction:column;align-items:stretch}
.stack>*{width:100%;text-align:center}
.a{--c:var(--line)!important}
.big{--c:var(--acc)!important}
.fu{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.fu textarea{min-height:80px}
.u{grid-column:1/-1;background:var(--acc);color:var(--accink);border-radius:12px;padding:10px 14px;margin:8px 0 8px auto;white-space:pre-wrap;max-width:90%;width:fit-content}
.as{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.fl{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;cursor:pointer}
.big,.sing{grid-column:1/-1}
.big{border-top-width:6px}
.sing summary{cursor:pointer;font-weight:600;padding:4px 0}
#grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin-top:12px}
select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
</style>
</head>
<body>
<main>
<h1>SaBre</h1>
<p class="sub">Eine Frage, mehrere KIs. Du wählst die beste Antwort.</p>

<details id="set">
<summary>API-Keys und Modelle</summary>
<div id="fields"></div>
<div class="f"><label style="font-weight:400"><input type="checkbox" id="short" style="width:auto;margin-right:8px">Kurze Antworten (höchstens 10 Sätze)</label></div>
<div class="f"><label style="font-weight:400"><input type="checkbox" id="merge" style="width:auto;margin-right:8px">Eine gemeinsame Antwort erstellen</label></div>
<div class="f"><label for="synth">Zusammenführen mit</label><select id="synth"></select><small>Dieses Modell fasst die Antworten zusammen. Groq ist meist am zuverlässigsten.</small></div>
<div class="row"><button id="save" class="go">Speichern</button><span id="saved" class="st"></span></div>
<p class="st">Die Keys bleiben nur in diesem Browser auf Deinem Gerät. Es reicht, wenn Du einen Key einträgst.</p>
</details>

<details id="hist"><summary>Gespeicherte Gespräche</summary><div id="hl"></div></details>
<div id="thread"></div>
<textarea id="q" placeholder="Was möchtest Du wissen?" aria-label="Deine Frage"></textarea>
<div class="row stack"><button id="send" class="go">Frage senden</button><label class="fl">Anhang<input type="file" id="file" multiple accept="image/*,application/pdf,.txt,.md,.csv,.json" hidden></label><button id="mic">Sprechen</button><button id="newc">Neues Gespräch</button></div>
<div class="st" id="fn"></div>
<label class="st"><input type="checkbox" id="web" style="width:auto;margin-right:6px">Websuche (nur Gemini)</label>
<div id="out"></div>
</main>

<script>
const P=[
 {id:'groq',name:'GPT-OSS (Groq)',c:'#f26b3a',type:'oa',url:'https://api.groq.com/openai/v1/chat/completions',model:'openai/gpt-oss-120b'},
 {id:'gemini',name:'Gemini (Google)',c:'#3b82f6',type:'gem',vision:true,model:'gemini-flash-lite-latest'},
 {id:'mistral',name:'Mistral',c:'#e8a317',type:'oa',vision:true,url:'https://api.mistral.ai/v1/chat/completions',model:'open-mistral-nemo'},
 {id:'openrouter',name:'OpenRouter (Gratis-Modell)',c:'#12a594',type:'oa',url:'https://openrouter.ai/api/v1/chat/completions',model:'openrouter/free'}
];
let S={keys:{},models:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('sabre')||'{}'))}catch(e){}
if(S.v!==2){S.models={};S.v=2}
const $=id=>document.getElementById(id);
const applyTheme=()=>{const h=new Date().getHours();document.documentElement.dataset.theme=(h>=7&&h<19)?'light':'dark'};applyTheme();setInterval(applyTheme,300000);

P.forEach(p=>{
 const d=document.createElement('div');d.className='f';
 d.innerHTML=`<label for="k-${p.id}">${p.name}</label><input id="k-${p.id}" name="key-${p.id}" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" placeholder="API-Key einfügen"><input id="m-${p.id}" name="model-${p.id}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Modellname"><small>Modellname bei Bedarf anpassen.</small>`;
 $('fields').appendChild(d);
 $('k-'+p.id).value=S.keys[p.id]||'';
 $('m-'+p.id).value=S.models[p.id]||p.model;
});
$('short').checked=S.short!==false;
$('merge').checked=S.merge!==false;
P.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('synth').appendChild(o)});
$('synth').value=S.synth||'groq';
if(!Object.values(S.keys).some(Boolean))$('set').open=true;

$('save').onclick=()=>{
 S.short=$('short').checked;S.merge=$('merge').checked;S.synth=$('synth').value;
 P.forEach(p=>{S.keys[p.id]=$('k-'+p.id).value.trim();S.models[p.id]=$('m-'+p.id).value.trim()||p.model});
 try{localStorage.setItem('sabre',JSON.stringify(S));$('saved').textContent='Gespeichert.'}
 catch(e){$('saved').textContent='Speichern nicht möglich. Die Keys gelten nur bis zum Schließen.'}
};

async function ask(p,msgs,o={}){
 const key=S.keys[p.id],model=S.models[p.id]||p.model,last=msgs.length-1,att=o.att||[];
 let res;
 if(p.type==='gem'){
  const contents=msgs.map((m,i)=>({role:m.role==='user'?'user':'model',parts:[{text:m.text}].concat(i===last?att.map(a=>({inline_data:{mime_type:a.mime,data:a.data}})):[])}));
  const body={contents};if(o.web)body.tools=[{google_search:{}}];
  res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
 }else{
  const imgs=att.filter(a=>a.mime.startsWith('image/'));
  const messages=msgs.map((m,i)=>({role:m.role,content:(i===last&&p.vision&&imgs.length)?[{type:'text',text:m.text}].concat(imgs.map(a=>({type:'image_url',image_url:{url:'data:'+a.mime+';base64,'+a.data}}))):m.text}));
  res=await fetch(p.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages})});
 }
 const data=await res.json().catch(()=>({}));
 if(!res.ok){
  const m=(data.error&&data.error.message)||'';
  if(res.status===429)throw new Error('Zu viele Anfragen. Warte ein paar Minuten und versuche es noch einmal.');
  if(res.status===503||res.status===529||/high demand|overloaded/i.test(m))throw new Error('Das Modell ist gerade überlastet. Versuche es in ein paar Minuten noch einmal.');
  if(res.status===401||res.status===403||/api key|unauthorized/i.test(m))throw new Error('Der API-Key wird nicht akzeptiert. Prüfe ihn in den Einstellungen.');
  if(res.status===404||/model/i.test(m))throw new Error('Modell nicht gefunden. Prüfe den Modellnamen in den Einstellungen.');
  throw new Error(m||('Fehler '+res.status));
 }
 const txt=p.type==='gem'?(data.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join(''):data.choices?.[0]?.message?.content;
 if(!txt)throw new Error('Keine Antwort erhalten.');
 return txt;
}

function md(s){
 const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const inl=x=>esc(x).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
 const UL=/^\s*[-*•]\s+/,OL=/^\s*\d+[.)]\s+/;
 const L=s.replace(/\r/g,'').split('\n');let h='',i=0,m;
 while(i<L.length){
  const l=L[i];
  if(/^```/.test(l)){const c=[];i++;while(i<L.length&&!/^```/.test(L[i]))c.push(L[i++]);i++;h+='<pre><code>'+esc(c.join('\n'))+'</code></pre>';continue}
  if(m=l.match(/^#{1,6}\s+(.*)/)){h+='<h3>'+inl(m[1])+'</h3>';i++;continue}
  if(UL.test(l)){h+='<ul>';while(i<L.length&&UL.test(L[i]))h+='<li>'+inl(L[i++].replace(UL,''))+'</li>';h+='</ul>';continue}
  if(OL.test(l)){h+='<ol>';while(i<L.length&&OL.test(L[i]))h+='<li>'+inl(L[i++].replace(OL,''))+'</li>';h+='</ol>';continue}
  if(/^\s*\|/.test(l)){const r=[];while(i<L.length&&/^\s*\|/.test(L[i]))r.push(L[i++]);
   h+='<div class="tw"><table>'+r.filter(x=>!/^[\s:|-]+$/.test(x)).map((x,k)=>'<tr>'+x.trim().replace(/^\||\|$/g,'').split('|').map(c=>(k?'<td>':'<th>')+inl(c.trim())+(k?'</td>':'</th>')).join('')+'</tr>').join('')+'</table></div>';continue}
  if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){h+='<hr>';i++;continue}
  if(!l.trim()){i++;continue}
  const q=[];while(i<L.length&&L[i].trim()&&!/^(```|#{1,6}\s|\s*\|)/.test(L[i])&&!UL.test(L[i])&&!OL.test(L[i]))q.push(L[i++]);
  if(!q.length)q.push(L[i++]);
  h+='<p>'+q.map(inl).join('<br>')+'</p>';
 }
 return h;
}

let ATT=[],TXT=[],CH={id:Date.now(),msgs:[]},CHATS=[];
try{CHATS=JSON.parse(localStorage.getItem('sabre-chats')||'[]')}catch(e){}
const saveChats=()=>{try{localStorage.setItem('sabre-chats',JSON.stringify(CHATS.slice(0,30)))}catch(e){}};
function thread(){const t=$('thread');t.innerHTML='';CH.msgs.forEach(m=>{const d=document.createElement('div');d.className=m.role==='user'?'u':'as t';if(m.role==='user')d.textContent=m.text;else d.innerHTML=md(m.text);t.appendChild(d)})}
function hist(){const h=$('hl');h.innerHTML='';if(!CHATS.length){h.textContent='Noch keine gespeicherten Gespräche.';return}
 CHATS.forEach(c=>{const r=document.createElement('div');r.className='row';const b=document.createElement('button');b.textContent=c.title;b.style.cssText='flex:1;text-align:left';b.onclick=()=>{CH=JSON.parse(JSON.stringify(c));$('out').innerHTML='';thread();$('hist').open=false};const x=document.createElement('button');x.textContent='Löschen';x.onclick=()=>{CHATS=CHATS.filter(y=>y.id!==c.id);saveChats();hist()};r.append(b,x);h.appendChild(r)})}
function done(text,q){CH.msgs.push({role:'user',text:q},{role:'assistant',text});if(!CH.title)CH.title=q.slice(0,40);CHATS=CHATS.filter(c=>c.id!==CH.id);CHATS.unshift(JSON.parse(JSON.stringify(CH)));saveChats();hist()}
$('newc').onclick=()=>{CH={id:Date.now(),msgs:[]};thread();$('out').innerHTML=''};
$('file').onchange=async e=>{ATT=[];TXT=[];const n=[];for(const f of e.target.files){n.push(f.name);
 if(/^image\/|application\/pdf/.test(f.type)){const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f)});ATT.push({mime:f.type,data:d})}
 else TXT.push('Datei '+f.name+':\n'+(await f.text()).slice(0,20000)+'\n\n')}
 $('fn').textContent=n.join(', ')};
hist();
let REC=null,CHK=[];
$('mic').onclick=async()=>{
 if(REC){REC.stop();return}
 if(!S.keys.groq){$('fn').textContent='Für die Spracheingabe wird der Groq-Key gebraucht.';$('set').open=true;return}
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:true});
  CHK=[];REC=new MediaRecorder(st);
  REC.ondataavailable=e=>CHK.push(e.data);
  REC.onstop=async()=>{
   st.getTracks().forEach(t=>t.stop());
   const mime=REC.mimeType||'audio/mp4';REC=null;
   $('mic').textContent='Wird umgewandelt …';$('mic').disabled=true;
   try{
    const fd=new FormData();fd.append('file',new Blob(CHK,{type:mime}),'aufnahme.'+(mime.includes('mp4')?'m4a':'webm'));fd.append('model','whisper-large-v3');
    const r=await fetch('https://api.groq.com/openai/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+S.keys.groq},body:fd});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error((d.error&&d.error.message)||('Fehler '+r.status));
    $('q').value=($('q').value+' '+d.text).trim();$('fn').textContent='';
   }catch(e){$('fn').textContent='Spracheingabe fehlgeschlagen: '+e.message}
   $('mic').textContent='Sprechen';$('mic').disabled=false;
  };
  REC.start();$('mic').textContent='Aufnahme läuft, zum Beenden tippen';
 }catch(e){$('fn').textContent='Kein Zugriff auf das Mikrofon. Erlaube ihn in den Safari-Einstellungen für diese Seite.'}
};
function addFollow(out){const d=document.createElement('div');d.className='fu';const t=document.createElement('textarea');t.placeholder='Weitere Frage …';t.setAttribute('aria-label','Weitere Frage');
 const b=document.createElement('button');b.className='go';b.textContent='Frage senden';b.onclick=()=>{if(!t.value.trim())return;$('q').value=t.value;$('send').click()};d.append(t,b);out.appendChild(d)}
$('send').onclick=()=>{
 const q=$('q').value.trim();
 const out=$('out');out.innerHTML='';
 if(!q)return;
 const active=P.filter(p=>S.keys[p.id]);
 if(!active.length){out.innerHTML='<p class="hint">Trag zuerst oben mindestens einen API-Key ein und tippe auf „Speichern“.</p>';$('set').open=true;return}
 const short=$('short').checked,merge=$('merge').checked&&active.length>1;
 $('send').disabled=true;
 const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e};
 const copyBtn=(b,getText)=>{b.hidden=false;b.onclick=()=>navigator.clipboard.writeText(getText()).then(()=>{b.textContent='Kopiert'},()=>{b.textContent='Kopieren nicht möglich'})};
 const att=ATT,qq=TXT.join('')+q+(short?'\n\nAntworte knapp in höchstens 10 Sätzen.':''),web=$('web').checked;
 ATT=[];TXT=[];$('file').value='';$('fn').textContent='';$('q').value='';
 thread();const ub=mk('div','u',q);out.appendChild(ub);
 let box=out,cst,ct,cb;
 if(merge){
  const c=mk('article','a big');c.style.setProperty('--c','var(--acc)');
  cst=mk('div','st','Sammelt die Antworten …');ct=mk('div','t');cb=mk('button','','Antwort kopieren');cb.hidden=true;
  c.append(mk('h2','','Gemeinsame Antwort'),cst,ct,cb);out.appendChild(c);
  const d=mk('details','sing');d.appendChild(mk('summary','','Einzelantworten anzeigen'));
  box=mk('div');box.id='grid';d.appendChild(box);out.appendChild(d);
 }
 Promise.allSettled(active.map(p=>{
  const c=mk('article','a');c.style.setProperty('--c',p.c);
  const st=mk('div','st','Antwortet …'),t=mk('div','t'),b=mk('button','','Antwort kopieren');b.hidden=true;
  c.append(mk('h2','',p.name),st,t,b);box.appendChild(c);
  const t0=performance.now();
  return ask(p,CH.msgs.concat([{role:'user',text:qq}]),{att,web:web&&p.type==='gem'}).then(r=>{
   st.textContent=((performance.now()-t0)/1000).toFixed(1).replace('.',',')+' s';
   t.innerHTML=md(r);copyBtn(b,()=>r);
   return {name:p.name,text:r};
  }).catch(e=>{st.classList.add('e');st.textContent=e.name==='TypeError'?'Keine Verbindung. Prüfe Dein Netz.':'Fehler: '+e.message;return null});
 })).then(async res=>{
  const ok0=res.map(x=>x.value).filter(Boolean);if(!merge&&ok0.length)done(ok0[0].text,q);
  if(merge){
   const ok=res.map(x=>x.value).filter(Boolean);
   const t0=performance.now();
   if(!ok.length){cst.classList.add('e');cst.textContent='Keine Antwort erhalten. Details stehen unter „Einzelantworten“.';}
   else if(ok.length===1){cst.textContent='Nur eine Antwort war verfügbar.';ct.innerHTML=md(ok[0].text);copyBtn(cb,()=>ok[0].text);done(ok[0].text,q)}
   else{
    cst.textContent='Führt '+ok.length+' Antworten zusammen …';
    const sp=active.find(p=>p.id===$('synth').value)||active[0];
    const prompt='Frage:\n'+q+'\n\nHier sind '+ok.length+' Antworten verschiedener KIs:\n\n'+ok.map((o,i)=>'--- Antwort '+(i+1)+' ---\n'+o.text).join('\n\n')+'\n\nFasse die besten und übereinstimmenden Inhalte zu EINER klaren Antwort zusammen. Nenne Widersprüche kurz und lass offensichtliche Fehler weg. Antworte in der Sprache der Frage'+(short?', knapp in höchstens 10 Sätzen':'')+'. Erwähne die einzelnen KIs nicht.';
    try{
     const r=await ask(sp,[{role:'user',text:prompt}]);
     cst.textContent='Aus '+ok.length+' Antworten zusammengeführt ('+((performance.now()-t0)/1000).toFixed(1).replace('.',',')+' s)';
     ct.innerHTML=md(r);copyBtn(cb,()=>r);done(r,q);
    }catch(e){cst.classList.add('e');cst.textContent='Zusammenführen fehlgeschlagen: '+e.message+' Die Einzelantworten findest Du unten.'}
   }
  }
  addFollow(out);$('send').disabled=false;
 });
};
</script>
</body>
</html>
